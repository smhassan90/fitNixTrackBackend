name: Test, Build and Deploy

on:
  push:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify existing functionality
    runs-on: ubuntu-latest
    env:
      # CI does not connect to MySQL. Prisma only needs a syntactically valid URL for `prisma generate` / schema load.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      GYM_TIMEZONE: Asia/Karachi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type check
        run: npm run type-check

      - name: Run regression tests
        run: npm test

      - name: Test device access-control planner
        run: python src/test_access_control_dry_run.py

      - name: Build
        run: npm run build
