name: Build and Deploy

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    name: Build and Deploy to Vercel
    runs-on: ubuntu-latest
    # GitHub Actions does NOT read Vercel env vars. Set DATABASE_URL in:
    # Repo → Settings → Secrets and variables → Actions → DATABASE_URL
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require DATABASE_URL (GitHub Actions secret)
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is empty in GitHub Actions. Add repository secret DATABASE_URL (not the same as Vercel project env). Encode @ in password as %40."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run linter
        run: npm run lint || echo "Linting skipped"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed - dist directory not found"
            exit 1
          fi
          echo "Build successful"

      - name: Deploy to Vercel
        continue-on-error: true
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      # Requires MySQL to allow inbound from GitHub Actions egress IPs (dynamic).
      # If this step fails with P1001,run migrations from an allowed host instead
      # (VPN + local, bastion, or DB allow list that includes GitHub egress IPs).
      - name: Run database migrations
        run: npx prisma migrate deploy
